name: Kiip Demo CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select test suite to run'
        required: true
        default: 'regression'
        type: choice
        options:
          - regression
          - smoke

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI Mock App Background Server
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          sleep 2

      - name: Run Robot Framework Tests Based on Selection
        run: |
          mkdir -p logs/screenshots
          if [ "${{ github.event.inputs.test_suite }}" == "smoke" ]; then
            echo "Running Smoke Tests..."
            robot --variable BASE_URL:http://127.0.0.1:8000 --include smoke tests/
          else
            echo "Running Full Regression Tests..."
            robot --variable BASE_URL:http://127.0.0.1:8000 tests/
          fi

      - name: Upload Test Results & Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-test-artifacts-${{ github.event.inputs.test_suite || 'push' }}
          path: |
            logs/
            output.xml
            log.html
            report.html
          retention-days: 30

      - name: Simulate AWS Deployment
        if: success()
        run: |
          echo "Pipeline completed successfully for ${{ github.event.inputs.test_suite || 'push' }}!"
