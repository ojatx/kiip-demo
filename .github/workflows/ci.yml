name: Kiip Demo CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Start FastAPI Mock App Background Server
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          sleep 2

      - name: Run Robot Framework Smoke and Regression Tests
        run: |
          mkdir -p logs/screenshots
          robot --variable BASE_URL:http://127.0.0.1:8000 tests/

      - name: Upload Test Results & Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-test-artifacts
          path: |
            logs/
            output.xml
            log.html
            report.html
          retention-days: 30
