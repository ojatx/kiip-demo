name: Kiip Demo CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
  pull_request:
    branches: [ main, develop ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m Browser.entry init

      - name: Start Application Server
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          # Wait until the server is accepting connections
          until curl -s http://127.0.0.1:8000/ > /dev/null; do
            sleep 1
          done

      - name: Run Robot Framework smoke tests
        run: |
          robot tests/smoke.robot

  regression:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m Browser.entry init

      - name: Start Application Server
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Run Robot Framework regression tests
        run: |
          robot tests/regression.robot

  deploy-staging:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging Stub
        run: echo "Deploying to staging environment..."

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Stub
        run: echo "Deploying to production environment..."
