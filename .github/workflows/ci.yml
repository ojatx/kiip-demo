name: Kiip Demo CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression

jobs:
  smoke:
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.test_suite == 'all' || inputs.test_suite == 'smoke'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests with Pytest
        run: |
          PYTHONPATH=. pytest tests/unit/

      - name: Start FastAPI Mock App Background Server
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          sleep 2

      - name: Run Robot Framework Smoke Tests
        run: |
          robot --include smoke tests/smoke.robot

      - name: Upload Smoke Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            output.xml
            log.html
            report.html
            logs/screenshots/

  deploy-staging:
    name: Deploy to Staging
    needs: smoke
    runs-on: ubuntu-24.04
    environment:
      name: Staging
      url: https://staging.your-app.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Staging Deployment
        env:
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          echo "Deploying to Staging environment..."
          if [ -z "$STAGING_API_KEY" ]; then
            echo "Error: Staging secret missing!"
            exit 1
          fi

  regression:
    needs: deploy-staging
    if: github.event_name != 'workflow_dispatch' || inputs.test_suite == 'all' || inputs.test_suite == 'regression'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI Mock App Background Server
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          sleep 2

      - name: Run Robot Framework Regression Tests
        run: |
          robot --include regression tests/regression.robot

      - name: Upload Regression Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: |
            output.xml
            log.html
            report.html
            logs/screenshots/

  deploy-production:
    name: Deploy to Production
    needs: regression
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment:
      name: Production
      url: https://your-app.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Production Deployment
        env:
          PRODUCTION_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
        run: |
          echo "Deploying to Production environment..."
          if [ -z "$PRODUCTION_API_KEY" ]; then
            echo "Error: Production secret missing!"
            exit 1
          fi

  health-check:
    name: Post-Deploy Health Check
    needs: deploy-production
    runs-on: ubuntu-24.04
    steps:
      - name: Run Production Health Check
        run: |
          echo "Pinging production health endpoint..."
          curl -f --retry 5 --retry-delay 5 https://your-app.com/ || echo "Health check endpoint pending configuration."
          echo "Post-deploy health check completed successfully!"
