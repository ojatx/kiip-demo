name: Kiip Demo CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      HOME: /Users/oscarjuarez
      RUNNER_TOOL_CACHE: /Users/oscarjuarez/hostedtoolcache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI Mock App Background Server
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          sleep 2

      - name: Run Robot Framework Smoke and Regression Tests
        run: |
          mkdir -p logs/screenshots
          robot --variable BASE_URL:http://127.0.0.1:8000 tests/

      - name: Upload Test Results & Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-test-artifacts
          path: |
            logs/
            output.xml
            log.html
            report.html
          retention-days: 30

      - name: Simulate AWS Deployment
        if: success()
        run: |
          echo "Tests passed successfully on local Apple Silicon runner!"
