name: Kiip Demo CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '.github/**'
      - 'README.md'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-browser

      - name: Initialize Playwright Browsers
        run: |
          rfbrowser init

      - name: Run Smoke Tests
        run: |
          robot tests/smoke.robot

  regression:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-browser

      - name: Initialize Playwright Browsers
        run: |
          rfbrowser init

      - name: Run Regression Suite
        run: |
          robot tests/regression.robot

  deploy-staging:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Staging Deployment
        env:
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          echo "Deploying to Staging environment..."
          if [ -z "$STAGING_API_KEY" ]; then
            echo "Error: Staging secret missing!"
            exit 1
          fi

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Production Deployment
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
        run: |
          echo "Deploying to Production environment..."
          if [ -z "$PROD_API_KEY" ]; then
            echo "Error: Production secret missing!"
            exit 1
          fi
